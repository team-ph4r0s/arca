# SPDX-License-Identifier: AGPL-3.0-only
# Removes GitHub releases and tags older than a floor version (those signed with an early,
# retired key). Started by hand only: a release tag never deletes anything. Without
# dry-run: false it only lists what it would delete.
name: prune-releases

on:
  workflow_dispatch:
    inputs:
      floor:
        description: "Delete releases and tags below this version (MAJOR.MINOR.PATCH)"
        type: string
        default: "0.3.0"
      dry-run:
        description: "Only list what would be deleted"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: prune-releases
  cancel-in-progress: false

jobs:
  prune:
    name: releases and tags below ${{ inputs.floor }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: delete (or list)
        env:
          GH_TOKEN: ${{ github.token }}
          FLOOR: ${{ inputs.floor }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          [[ "$FLOOR" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::floor must be MAJOR.MINOR.PATCH" >&2; exit 1; }
          below() {
            local v="${1#v}"
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || return 1
            [ "$v" != "$FLOOR" ] && [ "$(printf '%s\n%s\n' "$v" "$FLOOR" | sort -V | head -n1)" = "$v" ]
          }
          gh release list --repo "$GITHUB_REPOSITORY" --limit 500 --json tagName --jq '.[].tagName' | while read -r t; do
            below "$t" || continue
            if [ "$DRY_RUN" = true ]; then
              echo "would delete release $t"
            else
              echo "deleting release $t"
              gh release delete "$t" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y
            fi
          done
          # Tags that never had a release object.
          gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref' | sed 's#^refs/tags/##' | while read -r t; do
            below "$t" || continue
            if [ "$DRY_RUN" = true ]; then
              echo "would delete tag $t"
            else
              echo "deleting tag $t"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$t"
            fi
          done
