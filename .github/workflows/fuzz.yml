# SPDX-License-Identifier: AGPL-3.0-only
# Additional terms under AGPLv3 section 7: see LICENSE_ADDITIONAL_TERMS.md in the repository root.
#
# Coverage-guided fuzzing (libFuzzer via cargo-fuzz, nightly) of the parsers and the scanner.
#
#   pull request  a short run (60 s per target) from the seeds in tests/fixtures
#   weekly        a long run (30 min per target)
#   dispatch      the same, with a duration of your choice
#
# Corpora and crash artifacts are uploaded, never committed (they may contain hostile files).
#
# The deterministic, no-nightly counterparts run in the ordinary test job and, with a large
# iteration count, in the `mutation` job below: ARCA_FUZZ_ITERS / ARCA_FUZZ_SEED drive
# crates/arca-xray/src/tests/mutation.rs, crates/arca-image/tests/mutation.rs and
# crates/arca-container/tests/jet_mutation.rs.
name: fuzz

on:
  pull_request:
    paths:
      - "crates/**"
      - "fuzz/**"
      - "tests/fixtures/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      seconds:
        description: "seconds per target"
        default: "300"

permissions:
  contents: read

env:
  # A dated nightly, so a fuzzing run is repeatable; move it forward deliberately.
  FUZZ_NIGHTLY: nightly-2026-10-15

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [scan, sanitize, wire, zip, cfb, xml, preview, decrypt, image, png, jpeg, gif, bmp, exif, jet, pdf, rtf, doc, xls, ppt, odf, msg, vsd, formula, numfmt, plain]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install "$FUZZ_NIGHTLY" --profile minimal
          cargo install cargo-fuzz --version 0.12.0 --locked
      - name: seeds (the real-software fixtures)
        run: |
          set -euo pipefail
          dir="fuzz/corpus/${{ matrix.target }}"
          mkdir -p "$dir"
          case "${{ matrix.target }}" in
            image|png|jpeg|gif|bmp|exif) cp crates/arca-image/tests/fixtures/*.jpg crates/arca-image/tests/fixtures/*.png "$dir/" ;;
            jet) cp tests/fixtures/access-2000.mdb tests/fixtures/access-2016.accdb "$dir/" ;;
            pdf) cp tests/fixtures/*.pdf "$dir/" ;;
            rtf) cp tests/fixtures/*.rtf "$dir/" ;;
            doc) cp tests/fixtures/*.doc "$dir/" ;;
            xls) cp tests/fixtures/*.xls "$dir/" ;;
            ppt) cp tests/fixtures/*.ppt "$dir/" ;;
            odf) cp tests/fixtures/*.od? "$dir/" ;;
            msg|vsd) cp tests/fixtures/*.doc tests/fixtures/*.ppt "$dir/" ;;
            formula) printf '%s' 'SUM(A1:B3)*2' > "$dir/sum"; printf '%s' 'IF(Data!A1>0,VLOOKUP(B1,A1:B3,2,FALSE),"x")' > "$dir/if" ;;
            numfmt) printf '\0\0\0\0\0\0\x59\x40#,##0.00;[Red]-0.00' > "$dir/money"; printf '\0\0\0\0\0\x10\xe5\x40yyyy-mm-dd hh:mm' > "$dir/date" ;;
            plain) cp tests/fixtures/*.txt tests/fixtures/*.csv tests/fixtures/*.md "$dir/" ;;
            *) cp tests/fixtures/* "$dir/" ;;
          esac
      - name: fuzz
        working-directory: fuzz
        env:
          SECONDS_PER_TARGET: ${{ github.event_name == 'pull_request' && '60' || github.event.inputs.seconds || '1800' }}
        run: |
          dict=dictionaries/documents.dict
          case "${{ matrix.target }}" in
            scan|sanitize|zip|cfb|xml) dict=dictionaries/ooxml.dict ;;
            image|png|jpeg|gif|bmp|exif) dict=dictionaries/images.dict ;;
            pdf) dict=dictionaries/pdf.dict ;;
            rtf) dict=dictionaries/rtf.dict ;;
            doc|xls|ppt|msg|vsd) dict=dictionaries/cfb.dict ;;
            odf) dict=dictionaries/odf.dict ;;
            formula) dict=dictionaries/formula.dict ;;
            numfmt) dict=dictionaries/numfmt.dict ;;
            plain) dict=dictionaries/text.dict ;;
          esac
          cargo +"$FUZZ_NIGHTLY" fuzz run "${{ matrix.target }}" -- \
            -dict="$dict" -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048 -timeout=30
      - name: coverage of the corpus (scheduled and manual runs)
        if: ${{ github.event_name != 'pull_request' }}
        working-directory: fuzz
        run: |
          set -euo pipefail
          rustup component add --toolchain "${FUZZ_NIGHTLY:-nightly}" llvm-tools-preview
          cargo +"${FUZZ_NIGHTLY:-nightly}" fuzz coverage "${{ matrix.target }}"
          llvm_cov="$(find "$(rustc +"${FUZZ_NIGHTLY:-nightly}" --print sysroot)" -name llvm-cov -type f | head -n1)"
          bin="$(find target -path "*/coverage/*/release/${{ matrix.target }}" -type f | head -n1)"
          "$llvm_cov" report "$bin" -instr-profile="coverage/${{ matrix.target }}/coverage.profdata" \
            -ignore-filename-regex='/(\.cargo|rustc)/' > "coverage/${{ matrix.target }}/report.txt"
          tail -n 3 "coverage/${{ matrix.target }}/report.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ github.event_name != 'pull_request' }}
        with:
          name: fuzz-coverage-${{ matrix.target }}
          path: fuzz/coverage/${{ matrix.target }}/report.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

  # Deterministic mutation tests (no nightly, no sanitizers): same inputs for the same seed, so
  # a failure reproduces with the seed printed in the log. Weekly and on demand, not on PRs.
  mutation:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: mutation tests (release profile)
        env:
          # The run number gives every run its own seed; the log prints it, so a failure replays.
          ARCA_FUZZ_SEED: ${{ github.run_number }}
          ARCA_FUZZ_ITERS: ${{ github.event_name == 'schedule' && '20000' || '2000' }}
        run: |
          set -euo pipefail
          echo "ARCA_FUZZ_SEED=$ARCA_FUZZ_SEED ARCA_FUZZ_ITERS=$ARCA_FUZZ_ITERS"
          cargo test --release --locked -p arca-xray mutation_fuzz
          cargo test --release --locked -p arca-image --test mutation
          cargo test --release --locked -p arca-container --test jet_mutation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: mutation-failure-inputs
          path: /tmp/arca-fuzz-failure-*.bin
          if-no-files-found: ignore
